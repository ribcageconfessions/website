<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#DFE4D1">
  <meta name="description" content="A flowing mosaic for photos, videos, and music.">
  <title>Mosaic — Keep collecting</title>

  <style>
    :root {
      color-scheme: light;
      --bg: #DFE4D1;
      --panel: #EDF0E3;
      --cream: #F8F6EC;
      --text: #283629;
      --muted: #596750;
      --forest: #36583F;
      --line: #36583F26;
      --radius: 22px;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 90% 0%, #F8F6EC99, transparent 40%),
        var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input { font: inherit; }

    button, .download {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--cream);
      color: var(--text);
      text-decoration: none;
      cursor: pointer;
    }

    button:hover, .download:hover {
      background: var(--panel);
      border-color: var(--forest);
    }

    button:disabled { opacity: .5; cursor: wait; }

    :focus-visible {
      outline: 3px solid var(--forest);
      outline-offset: 4px;
    }

    .primary {
      background: var(--forest);
      color: var(--cream);
      border-color: var(--forest);
      font-weight: 700;
    }

    .primary:hover { background: #294631; }

    .shell {
      max-width: 1600px;
      margin: auto;
      padding: 0 28px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: 24px 0;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 21px;
      letter-spacing: 3px;
      font-weight: 850;
    }

    .logo {
      display: grid;
      grid-template-columns: repeat(2, 12px);
      gap: 3px;
      transform: rotate(-8deg);
    }

    .logo i { height: 12px; background: var(--forest); border-radius: 3px; }
    .logo i:nth-child(2) { background: #92A57D; }
    .logo i:nth-child(3) { background: #C0AA88; }
    .logo i:nth-child(4) { background: #71865C; }

    .hero {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 40px;
      padding: 52px 0 34px;
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 750;
      color: var(--forest);
    }

    h1 {
      margin: 16px 0;
      font-size: clamp(44px, 6vw, 80px);
      line-height: 1.02;
      letter-spacing: -4px;
      font-weight: 750;
    }

    h1 em {
      color: var(--forest);
      font-family: Georgia, serif;
      font-weight: 400;
    }

    .hero p {
      max-width: 450px;
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .hero-note {
      flex-shrink: 0;
      font-size: 13px;
      color: var(--muted);
      text-align: right;
      line-height: 1.8;
    }

    .dropzone {
      width: 100%;
      display: block;
      padding: 25px;
      border: 1px dashed #647A5270;
      border-radius: var(--radius);
      background: #F8F6EC66;
      text-align: center;
    }

    .dropzone strong { display: block; margin-bottom: 7px; }
    .dropzone span { color: var(--muted); font-size: 12px; }

    .dropzone.dragging {
      background: var(--cream);
      border-color: var(--forest);
      outline: 3px solid #36583F20;
    }

    #status {
      min-height: 20px;
      font-size: 12px;
      color: var(--muted);
      margin: 10px 0 20px;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding: 14px 0;
      background: #DFE4D1F2;
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      margin-bottom: 22px;
    }

    .filters, .tools {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filters button { border-radius: 999px; font-size: 12px; }

    .filters button[aria-pressed="true"] {
      background: var(--forest);
      color: var(--cream);
    }

    #search {
      width: 210px;
      padding: 11px 15px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--cream);
      color: var(--text);
    }

    #search::placeholder { color: var(--muted); }

    .preview-toggle {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      cursor: pointer;
    }

    .preview-toggle input { accent-color: var(--forest); }

    .collection-heading {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      margin: 0 0 18px;
    }

    h2 { font-size: 18px; margin: 0; }
    #count { color: var(--muted); font-size: 12px; }

    /* Small grid rows let tiles form a dense, varied mosaic. */
    .mosaic {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      grid-auto-rows: 10px;
      grid-auto-flow: dense;
      gap: 12px;
    }

    .tile {
      position: relative;
      grid-column: span 2;
      grid-row: span 14;
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: 0 8px 25px #36583F0D;
      animation: appear .35s ease both;
    }

    .tile.tall { grid-row: span 20; }
    .tile.short { grid-row: span 11; }
    .tile.wide { grid-column: span 4; }

    .tile-open {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      padding: 0;
      border: 0;
      border-radius: inherit;
      background: transparent;
      text-align: left;
    }

    .tile-open img, .tile-open video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: transform .45s;
    }

    .tile-open:hover img, .tile-open:hover video { transform: scale(1.04); }

    .tile-open::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(transparent 40%, #18291FE6);
      pointer-events: none;
    }

    .tile-info {
      position: absolute;
      bottom: 17px;
      left: 17px;
      right: 17px;
      color: var(--cream);
      pointer-events: none;
    }

    .tile-info h3 {
      margin: 0 0 5px;
      font-size: 15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tile-info small { font-size: 11px; color: #E4EAD8; }

    .badge {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 6px 9px;
      border-radius: 999px;
      background: #283E30D9;
      color: var(--cream);
      font-size: 9px;
      letter-spacing: 1px;
      text-transform: uppercase;
      pointer-events: none;
    }

    .actions {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 6px;
    }

    .actions button, .actions a {
      width: 32px;
      height: 32px;
      padding: 0;
      border-radius: 10px;
      background: #F8F6ECF0;
      color: var(--forest);
    }

    .music-art {
      height: 100%;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #BCC9A8, #647A52);
    }

    .tile:nth-child(even) .music-art {
      background: linear-gradient(135deg, #E5DDC7, #97AC86);
    }

    .record {
      display: grid;
      place-items: center;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      color: var(--bg);
      font-size: 40px;
      background:
        repeating-radial-gradient(circle, #36513D 0 2px, #233B2C 3px 5px);
      box-shadow: 0 15px 35px #233B2C33;
    }

    .empty {
      padding: 60px 20px;
      text-align: center;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #F8F6EC55;
    }

    .empty strong { display: block; color: var(--text); margin-bottom: 10px; }

    #sentinel {
      display: grid;
      place-items: center;
      min-height: 90px;
      padding: 20px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .load-more { margin: 0 auto 25px; }

    footer {
      padding: 22px 0;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    dialog {
      width: min(960px, 94vw);
      max-height: 90vh;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--bg);
      color: var(--text);
    }

    dialog::backdrop { background: #203327B3; backdrop-filter: blur(8px); }

    .viewer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 16px;
    }

    #viewer-title { overflow-wrap: anywhere; font-size: 17px; }

    #viewer-content img, #viewer-content video {
      display: block;
      width: 100%;
      max-height: 65vh;
      object-fit: contain;
      background: #233B2C;
      border-radius: 14px;
    }

    #viewer-content audio { width: 100%; margin: 22px 0; }
    #viewer-content .music-art { height: 280px; border-radius: 14px; }
    #playback-note { color: var(--muted); font-size: 12px; }

    @keyframes appear {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (min-width: 1300px) {
      .mosaic { grid-template-columns: repeat(8, minmax(0, 1fr)); }
    }

    @media (max-width: 900px) {
      .mosaic { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .hero-note { display: none; }
    }

    @media (max-width: 560px) {

    <main>

      <input
        id="file-input"
        type="file"
        accept="image/*,video/*,audio/*"
        multiple
        hidden
      >

      <button id="dropzone" class="dropzone" disabled>
        <strong>Drop a few new pieces into your world</strong>
        <span>Click to upload photos, videos, or music · 100 MB per file maximum</span>
      </button>

      <p id="status" role="status" aria-live="polite">Opening your collection…</p>

      <div class="toolbar">
        <nav class="filters" aria-label="Filter media">
          <button data-filter="all" aria-pressed="true">Everything</button>
          <button data-filter="image" aria-pressed="false">Photos</button>
          <button data-filter="video" aria-pressed="false">Videos</button>
          <button data-filter="audio" aria-pressed="false">Music</button>
        </nav>

        <div class="tools">
          <input
            id="search"
            type="search"
            placeholder="Find a piece…"
            aria-label="Search uploaded media"
          >
          <label class="preview-toggle">
            <input id="demo-toggle" type="checkbox">
            Endless preview
          </label>
        </div>
      </div>

      <div class="collection-heading">
        <h2>Your unfolding collection</h2>
        <span id="count"></span>
      </div>

      <section id="gallery" class="mosaic" aria-label="Mosaic media collection"></section>

      <div id="empty" class="empty" hidden>
        <strong id="empty-title">Your canvas is waiting.</strong>
        <span id="empty-text">Upload your first file, or enable Endless preview.</span>
      </div>

      <div id="sentinel">
        <span id="scroll-message"></span>
      </div>

      <button id="load-more" class="load-more" hidden>Load more pieces</button>
    </main>

    <footer>
      MOSAIC · Your uploads stay in this browser, not on a shared server.
      Clearing browser data can remove saved files.
    </footer>
  </div>

  <dialog id="viewer" aria-labelledby="viewer-title">
    <div class="viewer-header">
      <h2 id="viewer-title"></h2>
      <button id="close-viewer" aria-label="Close preview">✕</button>
    </div>
    <div id="viewer-content"></div>
    <p id="playback-note" hidden>
      Playback depends on the file format supported by your browser.
    </p>
  </dialog>

  <script>
    "use strict";

    const $ = selector => document.querySelector(selector);
    const gallery = $("#gallery");
    const sentinel = $("#sentinel");
    const status = $("#status");
    const viewer = $("#viewer");
    const viewerContent = $("#viewer-content");

    const BATCH_SIZE = 18;
    const MAX_SIZE = 100 * 1024 * 1024;
    const labels = { image: "Photo", video: "Video", audio: "Music" };

    let database = null;
    let items = [];
    let filtered = [];
    let cursor = 0;
    let demoIndex = 0;
    let filter = "all";
    let busy = false;
    let loading = false;
    let ready = false;
    let observer = null;

    function node(tag, className, text) {
      const result = document.createElement(tag);
      if (className) result.className = className;
      if (text !== undefined) result.textContent = text;
      return result;
    }

    function formatSize(bytes) {
      return bytes < 1024 * 1024
        ? `${Math.round(bytes / 1024)} KB`
        : `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
    }

    function setBusy(value) {
      busy = value;
      $("#upload-button").disabled = value;
      $("#dropzone").disabled = value;
    }

    function openDatabase() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open("sage-mosaic", 1);

        request.onupgradeneeded = () => {
          request.result.createObjectStore("files", { keyPath: "id" });
        };

        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
        request.onblocked = () => {
          status.textContent = "Close other tabs using this site to open storage.";
        };
      });
    }

    function readFiles() {
      return new Promise((resolve, reject) => {
        const transaction = database.transaction("files", "readonly");
        const request = transaction.objectStore("files").getAll();
        transaction.oncomplete = () => resolve(request.result);
        transaction.onabort = () => reject(transaction.error);
        transaction.onerror = () => reject(transaction.error);
      });
    }

    function storeFile(action, value) {
      return new Promise((resolve, reject) => {
        const transaction = database.transaction("files", "readwrite");
        const store = transaction.objectStore("files");

        if (action === "put") store.put(value);
        else store.delete(value);

        transaction.oncomplete = () => resolve();
        transaction.onabort = () => reject(transaction.error);
        transaction.onerror = () => reject(transaction.error);
      });
    }

    function musicArtwork() {
      const art = node("div", "music-art");
      art.setAttribute("aria-hidden", "true");
      art.append(node("div", "record", "♫"));
      return art;
    }

    /* Generated locally: no external image requests or sample uploads. */
    function makeDemo(index) {
      const palettes = [
        ["#DFE4D1", "#36583F", "#A7BA91"],
        ["#EFE8D7", "#8D9E78", "#C7B48D"],
        ["#BCCAAB", "#45664C", "#F1EFDF"],
        ["#D4DCC7", "#71865C", "#AEBD98"],
        ["#E8DFCA", "#8A795D", "#C9D2B8"]
      ];

      const [bg, dark, light] = palettes[index % palettes.length];
      const x = 80 + (index * 73) % 450;
      const y = 90 + (index * 47) % 390;

      const shapes = [
        `<circle cx="${x}" cy="${y}" r="190" fill="${dark}"/>
         <circle cx="${600 - x}" cy="${600 - y}" r="155" fill="${light}"/>`,

        `<path d="M70 600V260a230 230 0 0 1 460 0v340" fill="${dark}"/>
         <path d="M180 600V285a120 120 0 0 1 240 0v315" fill="${light}"/>`,

        `<path d="M0 390Q150 180 310 350T600 280V600H0Z" fill="${dark}"/>
         <path d="M0 480Q170 310 330 450T600 390V600H0Z" fill="${light}"/>
         <circle cx="430" cy="130" r="66" fill="${light}"/>`,

        `<rect x="65" y="70" width="220" height="460" rx="110" fill="${dark}"/>
         <rect x="310" y="70" width="220" height="460" rx="110" fill="${light}"/>`
      ];

      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="600" height="600"
             viewBox="0 0 600 600">
          <rect width="600" height="600" fill="${bg}"/>
          ${shapes[index % shapes.length]}
        </svg>
      `;

      return {
        name: `Mosaic study ${String(index + 1).padStart(3, "0")}`,
        kind: "image",
        demo: true,
        url: "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg)
      };
    }

    function openViewer(item) {
      $("#viewer-title").textContent = item.name;
      $("#playback-note").hidden = item.kind === "image";
      viewerContent.replaceChildren();

      if (item.kind === "image") {
        const image = node("img");
        image.src = item.url;
        image.alt = item.name;
        viewerContent.append(image);
      } else {
        if (item.kind === "audio") viewerContent.append(musicArtwork());

        const media = node(item.kind);
        media.src = item.url;
        media.controls = true;
        media.preload = "metadata";
        if (item.kind === "video") media.playsInline = true;
        viewerContent.append(media);
      }

      viewer.showModal();
    }

    $("#close-viewer").addEventListener("click", () => viewer.close());

    viewer.addEventListener("close", () => {
      viewerContent.querySelectorAll("audio, video").forEach(media => {
        media.pause();
        media.removeAttribute("src");
        media.load();
      });
      viewerContent.replaceChildren();
    });

    viewer.addEventListener("click", event => {
      if (event.target !== viewer) return;

      const rect = viewer.getBoundingClientRect();
      if (
        event.clientX < rect.left || event.clientX > rect.right ||
        event.clientY < rect.top || event.clientY > rect.bottom
      ) viewer.close();
    });

    async function removeItem(item) {
      if (busy || !confirm(`Delete "${item.name}" from this collection?`)) return;

      setBusy(true);

      try {
        if (database) await storeFile("delete", item.id);
        items = items.filter(entry => entry.id !== item.id);
        URL.revokeObjectURL(item.url);
        resetGallery();
        status.textContent = "Piece removed.";
      } catch {
        status.textContent = "Could not delete this file. Try again.";
      } finally {
        setBusy(false);
      }
    }

    function makeTile(item, index) {
      const tile = node("article", "tile");

      if (index % 5 === 0) tile.classList.add("tall");
      else if (index % 5 === 3) tile.classList.add("short");

      if (index % 9 === 4) tile.classList.add("wide");

      const open = node("button", "tile-open");
      open.type = "button";
      open.setAttribute("aria-label", `Open ${item.name}`);
      open.addEventListener("click", () => openViewer(item));

      if (item.kind === "audio") {
        open.append(musicArtwork());
      } else {
        const media = node(item.kind === "image" ? "img" : "video");
        media.src = item.url;

        if (item.kind === "image") {
          media.alt = "";
          media.loading = "lazy";
          media.decoding = "async";
        } else {
          media.muted = true;
          media.playsInline = true;
          media.preload = "metadata";
          media.setAttribute("aria-hidden", "true");
        }

        open.append(media);
      }

      const badge = node("span", "badge", item.demo ? "Design preview" : labels[item.kind]);
      const info = node("div", "tile-info");

      info.append(
        node("h3", "", item.name),
        node("small", "", item.demo
          ? "Generated artwork · Endless series"
          : `${labels[item.kind]} · ${formatSize(item.size)}`)
      );

      tile.append(open, badge, info);

      if (!item.demo) {
        const actions = node("div", "actions");

        const download = node("a", "download", "↓");
        download.href = item.url;
        download.download = item.name;
        download.title = "Download";
        download.setAttribute("aria-label", `Download ${item.name}`);

        const remove = node("button", "", "×");
        remove.type = "button";
        remove.title = "Delete";
        remove.setAttribute("aria-label", `Delete ${item.name}`);
        remove.addEventListener("click", () => removeItem(item));

        actions.append(download, remove);
        tile.append(actions);
      }

      return tile;
    }

    function demoAllowed() {
      return $("#demo-toggle").checked &&
        (filter === "all" || filter === "image") &&
        !$("#search").value.trim();
    }

    function hasMore() {
      return cursor < filtered.length || demoAllowed();
    }

    function updateCollectionState() {
      const rendered = gallery.children.length;

      $("#count").textContent = demoAllowed()
        ? `${items.length} uploads · Endless preview`
        : `${filtered.length} ${filtered.length === 1 ? "piece" : "pieces"}`;

      $("#empty").hidden = rendered > 0;

      if (!rendered && items.length) {
        $("#empty-title").textContent = "No matching pieces.";
        $("#empty-text").textContent = "Try another search or filter.";
      } else {
        $("#empty-title").textContent = "Your canvas is waiting.";
        $("#empty-text").textContent =
          "Upload your first file, or enable Endless preview.";
      }

      $("#scroll-message").textContent = hasMore()
        ? "Keep scrolling to unfold more ↓"
        : rendered ? "You’re all caught up. Add another piece whenever inspiration strikes." : "";

      $("#load-more").hidden = !hasMore();
    }

    function loadBatch() {
      if (!ready || loading || !hasMore()) return;

      loading = true;
      if (observer) observer.unobserve(sentinel);

      gallery.setAttribute("aria-busy", "true");

      const fragment = document.createDocumentFragment();
      const start = gallery.children.length;
      let added = 0;

      while (added < BATCH_SIZE && cursor < filtered.length) {
        fragment.append(makeTile(filtered[cursor++], start + added));
        added++;
      }

      while (added < BATCH_SIZE && demoAllowed()) {
        fragment.append(makeTile(makeDemo(demoIndex++), start + added));
        added++;
      }

      gallery.append(fragment);
      gallery.setAttribute("aria-busy", "false");
      loading = false;
      updateCollectionState();

      /* Reobserve so another batch loads if the page is still too short. */
      requestAnimationFrame(() => {
        if (observer && hasMore()) observer.observe(sentinel);
      });
    }

    function resetGallery() {
      if (observer) observer.unobserve(sentinel);

      const query = $("#search").value.trim().toLowerCase();

      filtered = items.filter(item =>
        (filter === "all" || item.kind === filter) &&
        item.name.toLowerCase().includes(query)
      );

      cursor = 0;
      demoIndex = 0;
      gallery.replaceChildren();

      loadBatch();
      updateCollectionState();
    }

    async function importFiles(files) {
      if (busy || !files.length) return;

      setBusy(true);

      let added = 0;
      let skipped = 0;
      let failed = 0;

      try {
        for (const file of files) {
          const kind = file.type.split("/")[0];

          if (!["image", "video", "audio"].includes(kind) || file.size > MAX_SIZE) {
            skipped++;
            continue;
          }

          status.textContent = `Adding ${file.name}…`;

          const record = {
            id: crypto.randomUUID(),
            name: file.name,
            kind,
            size: file.size,
            created: Date.now(),
            blob: file
          };

          try {
            if (database) await storeFile("put", record);
            items.unshift({ ...record, url: URL.createObjectURL(file) });
            added++;
          } catch {
            failed++;
          }
        }

        resetGallery();

        const messages = [`${added} ${added === 1 ? "piece" : "pieces"} added.`];

        if (skipped) messages.push(`${skipped} skipped: unsupported type or over 100 MB.`);
        if (failed) messages.push(`${failed} could not be saved; storage may be full.`);
        if (!database) messages.push("Temporary mode: these files will disappear after refresh.");

        status.textContent = messages.join(" ");
      } finally {
        $("#file-input").value = "";
        setBusy(false);
      }
    }

    $("#upload-button").addEventListener("click", () => $("#file-input").click());
    $("#dropzone").addEventListener("click", () => $("#file-input").click());

    $("#file-input").addEventListener("change", event => {
      importFiles(Array.from(event.target.files));
    });

    let dragDepth = 0;
    const dropzone = $("#dropzone");

    dropzone.addEventListener("dragenter", event => {
      event.preventDefault();
      dragDepth++;
      if (!busy) dropzone.classList.add("dragging");
    });

    dropzone.addEventListener("dragover", event => {
      event.preventDefault();
      event.dataTransfer.dropEffect = busy ? "none" : "copy";
    });

    dropzone.addEventListener("dragleave", () => {
      dragDepth = Math.max(0, dragDepth - 1);
      if (!dragDepth) dropzone.classList.remove("dragging");
    });

    dropzone.addEventListener("drop", event => {
      event.preventDefault();
      dragDepth = 0;
      dropzone.classList.remove("dragging");
      importFiles(Array.from(event.dataTransfer.files));
    });

    window.addEventListener("dragover", event => event.preventDefault());
    window.addEventListener("drop", event => event.preventDefault());

    document.querySelectorAll("[data-filter]").forEach(button => {
      button.addEventListener("click", () => {
        filter = button.dataset.filter;

        document.querySelectorAll("[data-filter]").forEach(other => {
          other.setAttribute("aria-pressed", String(other === button));
        });

        resetGallery();
      });
    });

    let searchTimer;

    $("#search").addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(resetGallery, 180);
    });

    $("#demo-toggle").addEventListener("change", resetGallery);
    $("#load-more").addEventListener("click", loadBatch);

    async function initialize() {
      setBusy(true);

      try {
        database = await openDatabase();
        const stored = await readFiles();

        items = stored
          .sort((a, b) => b.created - a.created)
          .map(record => ({ ...record, url: URL.createObjectURL(record.blob) }));

        database.onversionchange = () => {
          database.close();
          database = null;
          status.textContent = "Storage changed in another tab. Reload to reconnect.";
        };

        status.textContent =
          "Ready. Uploads are saved in this browser, not sent to a server.";
      } catch {
        if (database) database.close();
        database = null;
        status.textContent =
          "Browser storage is unavailable. Uploads will work temporarily until refresh.";
      }

      /* Show the theme immediately for first-time visitors. */
      $("#demo-toggle").checked = items.length === 0;

      if ("IntersectionObserver" in window) {
        observer = new IntersectionObserver(entries => {
          if (entries.some(entry => entry.isIntersecting)) loadBatch();
        }, {
          rootMargin: "600px 0px"
        });
      }

      ready = true;
      resetGallery();
      setBusy(false);
    }

    initialize();
  </script>
</body>
</html>
